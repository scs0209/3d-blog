      - name: 리뷰 결과 및 성능 분석
        run: |
          if [ -f "review.txt" ]; then
            echo "=== 최종 리뷰 분석 ==="
            
            # 위험도 분석 (대소문자 구분 없이)
            if grep -qi "긴급" review.txt; then
              echo "::error title=긴급 위험도 감지::코드에서 긴급 수정이 필요한 이슈가 발견되었습니다."
              echo "FINAL_RISK_LEVEL=긴급" >> $GITHUB_ENV
            elif grep -qi "높음" review.txt; then
              echo "::warning title=높은 위험도 감지::코드에서 주의가 필요한 이슈가 발견되었습니다."
              echo "FINAL_RISK_LEVEL=높음" >> $GITHUB_ENV
            elif grep -qi "보통" review.txt; then
              echo "::notice title=보통 위험도::일반적인 개선사항이 발견되었습니다."
              echo "FINAL_RISK_LEVEL=보통" >> $GITHUB_ENV
            else
              echo "::notice title=낮은 위험도::코드 품질이 양호합니다."
              echo "FINAL_RISK_LEVEL=낮음" >> $GITHUB_ENV
            fi
            
            # 상세 성능 통계
            echo "=== 처리 성능 통계 ==="
            echo "- 총 파일 수: ${TOTAL_FILES:-0}"
            echo "- 계획된 처리 파일: ${PROCESSED_FILES:-0}"
            echo "- 실제 처리된 파일: ${ACTUAL_PROCESSED:-0}"
            echo "- 건너뛴 파일: ${SKIPPED_FILES:-0}"
            echo "- 총 처리 시간: ${REVIEW_DURATION:-0}초"
            echo "- 리뷰 모드: ${REVIEW_MODE:-unknown}"
            
            # 처리 효율성 계산
            if [ "${TOTAL_FILES:-0}" -gt 0 ]; then
              efficiency=$(( (${ACTUAL_PROCESSED:-0} * 100) / ${TOTAL_FILES:-1} ))
              echo "- 처리 효율성: ${efficiency}%"
              
              if [ "$efficiency" -lt 80 ]; then
                echo "::warning title=처리 효율성 낮음::${efficiency}%의 파일만 처리되었습니다."
              fi
            fi
            
            # 시간 제한 체크
            if [ "${TIME_LIMIT_REACHED:-false}" = "true" ]; then
              echo "::warning title=시간 제한 도달::일부 파일의 처리가 시간 제한으로 중단되었습니다."
            fi
            
            # 리뷰 품질 확인
            review_lines=$(wc -l < review.txt)
            review_size=$(wc -c < review.txt)
            echo "- 리뷰 결과 크기: ${review_lines}줄, ${review_size}바이트"
            
            if [ "$review_lines" -lt 20 ] && [ "${ACTUAL_PROCESSED:-0}" -gt 0 ]; then
              echo "::warning title=리뷰 결과 부족::리뷰 내용이 예상보다 적습니다. AI 모델 응답 확인이 필요합니다."
            fi
            
            echo "=== 리뷰 완료 ==="
            
          else
            echo "::error title=리뷰 실패::리뷰 파일이 생성되지 않았습니다."
            exit 1
          fi