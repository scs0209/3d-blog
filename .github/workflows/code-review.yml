name: Simple AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Test Basic Setup
        run: |
          echo "=== System Info ==="
          uname -a
          free -h
          df -h
          
      - name: Install and Test Ollama
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          
          echo "Starting Ollama server..."
          ollama serve &
          sleep 15
          
          echo "Testing Ollama connection..."
          curl http://localhost:11434/api/version
          
          echo "Pulling tiny model..."
          ollama pull tinyllama:1.1b
          
          echo "Testing model..."
          echo "Hello, please say hi in Korean" | ollama run tinyllama:1.1b
          
      - name: Simple Code Review
        run: |
          echo "Getting changed files..."
          git fetch origin ${{ github.base_ref }}
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -E '\.(py|js|ts|jsx|tsx)$' | head -1)
          
          if [ -n "$changed_files" ]; then
            echo "Reviewing: $changed_files"
            git diff origin/${{ github.base_ref }}..HEAD -- "$changed_files" | head -20 > diff.txt
            
            echo "Sending to AI..."
            cat diff.txt | ollama run tinyllama:1.1b "Review this code change briefly:" > review.txt
            
            echo "Review result:"
            cat review.txt
          else
            echo "No files to review"
            echo "No code changes found" > review.txt
          fi
          
      - name: Post Simple Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const review = fs.readFileSync('review.txt', 'utf8');
              
              // Pull Request 컨텍스트에서는 pull_request 번호 사용
              const prNumber = context.payload.pull_request?.number || context.issue.number;
              
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 Simple AI Review\n\n\`\`\`\n${review}\n\`\`\``
              });
              
              console.log('Comment posted successfully');
            } catch (error) {
              console.log('Error posting comment:', error.message);
              
              // 실패해도 workflow는 계속 진행
              core.warning(`Failed to post comment: ${error.message}`);
            }