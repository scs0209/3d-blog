name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-reviewer:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Ollama model
        run: ollama pull qwen2.5-coder

      - name: Start Ollama server
        run: nohup ollama serve > ollama.log 2>&1 &

      - name: Wait for Ollama server
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:11434/api/tags; then
              echo "Ollama server is up!"; break
            fi
            echo "Waiting for Ollama server..."; sleep 2
          done

      - name: Run AI Code Review
        run: python3 scripts/main.py