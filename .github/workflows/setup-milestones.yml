name: 🎯 마일스톤 설정

on:
  workflow_dispatch:
    inputs:
      title:
        description: '마일스톤 제목'
        required: true
        type: string
      
      description:
        description: '마일스톤 설명'
        required: false
        type: string
        default: '마일스톤 설명을 입력하세요'
      
      days:
        description: '완료까지 일수'
        required: false
        default: '30'
        type: choice
        options:
          - '7'
          - '14'
          - '30'
          - '60'
          - '90'

jobs:
  create-milestone:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: 마일스톤 생성
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '${{ github.event.inputs.title }}';
            const description = '${{ github.event.inputs.description }}';
            const days = parseInt('${{ github.event.inputs.days }}') || 30;
            
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + days);
            
            try {
              const { data: existingMilestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              });
              
              const existing = existingMilestones.find(m => m.title === title);
              
              if (existing) {
                await github.rest.issues.updateMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  milestone_number: existing.number,
                  title: title,
                  description: description,
                  due_on: dueDate.toISOString()
                });
                console.log('마일스톤 업데이트됨:', title);
              } else {
                const { data: newMilestone } = await github.rest.issues.createMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  description: description,
                  due_on: dueDate.toISOString()
                });
                console.log('새 마일스톤 생성됨:', title);
              }
            } catch (error) {
              console.error('오류:', error.message);
              core.setFailed(error.message);
            }