name: 🎯 GitHub 마일스톤 설정

on:
  workflow_dispatch: # 수동 실행만 가능
    inputs:
      version_milestones:
        description: '🚀 버전 릴리스 마일스톤 (v1.0.0, v1.1.0, v1.2.0)'
        required: false
        default: true
        type: boolean
      feature_milestones:
        description: '🎲 기능별 마일스톤 (3D 기능, 애니메이션 시스템)'
        required: false
        default: true
        type: boolean
      time_based_milestones:
        description: '📅 시기별 마일스톤 (월별, 분기별 목표)'
        required: false
        default: false
        type: boolean
      technical_milestones:
        description: '🔧 기술적 마일스톤 (기술 부채, 모바일 최적화)'
        required: false
        default: false
        type: boolean
      monitoring_milestones:
        description: '📊 성능 모니터링 마일스톤'
        required: false
        default: false
        type: boolean
      force_update:
        description: '기존 마일스톤도 강제 업데이트할지 선택'
        required: false
        default: false
        type: boolean

jobs:
  setup-milestones:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: 🎯 마일스톤 설정
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 사용자 입력값 가져오기
            const inputs = {
              versionMilestones: ${{ github.event.inputs.version_milestones || 'false' }},
              featureMilestones: ${{ github.event.inputs.feature_milestones || 'false' }},
              timeBasedMilestones: ${{ github.event.inputs.time_based_milestones || 'false' }},
              technicalMilestones: ${{ github.event.inputs.technical_milestones || 'false' }},
              monitoringMilestones: ${{ github.event.inputs.monitoring_milestones || 'false' }},
              forceUpdate: ${{ github.event.inputs.force_update || 'false' }}
            };

            console.log('🎯 선택된 옵션:', inputs);

            // 현재 날짜 기준으로 마감일 계산
            const now = new Date();
            const addDays = (date, days) => {
              const result = new Date(date);
              result.setDate(result.getDate() + days);
              // GitHub API는 완전한 ISO datetime을 요구함
              return result.toISOString();
            };
            
            const addMonths = (date, months) => {
              const result = new Date(date);
              result.setMonth(result.getMonth() + months);
              // GitHub API는 완전한 ISO datetime을 요구함
              return result.toISOString();
            };

            // 모든 마일스톤 정의
            const allMilestones = {
              version: [
                {
                  title: '🚀 v1.0.0 - 첫 번째 공식 릴리스',
                  description: '첫 번째 정식 버전 릴리스\n\n**주요 목표:**\n- ✅ 기본 3D 씬 구현 완료\n- ✅ 테마 전환 기능 완성\n- ✅ 반응형 디자인 적용\n- ✅ 기본 애니메이션 구현\n- ✅ 성능 최적화 기본 작업\n\n**기능 요구사항:**\n- 3D 모델 렌더링\n- 다크/라이트 테마 전환\n- 모바일 호환성\n- 기본 사용자 인터랙션',
                  due_on: addMonths(now, 1)
                },
                {
                  title: '🎨 v1.1.0 - UI/UX 개선',
                  description: '사용자 경험 향상 업데이트\n\n**주요 목표:**\n- 🎨 디자인 시스템 구축\n- 🔄 애니메이션 품질 향상\n- 📱 모바일 최적화\n- ♿ 접근성 개선\n\n**세부 작업:**\n- 컴포넌트 스타일 통일\n- 로딩 애니메이션 개선\n- 터치 제스처 지원\n- 키보드 네비게이션',
                  due_on: addMonths(now, 2)
                },
                {
                  title: '⚡ v1.2.0 - 성능 최적화',
                  description: '성능 및 안정성 개선\n\n**주요 목표:**\n- ⚡ 렌더링 성능 최적화\n- 📦 번들 크기 최적화\n- 🔧 메모리 사용량 개선\n- 🚀 로딩 속도 향상\n\n**기술적 개선:**\n- Three.js 최적화\n- 코드 스플리팅\n- 이미지 최적화\n- 캐싱 전략',
                  due_on: addMonths(now, 3)
                }
              ],
              
              feature: [
                {
                  title: '🎲 3D 기능 완성',
                  description: '3D 관련 핵심 기능 구현\n\n**포함 기능:**\n- 🏠 3D 룸 모델 구현\n- 👨‍🚀 우주비행사 애니메이션\n- 🌟 파티클 시스템\n- 🎮 인터랙티브 요소\n- 🌍 행성 모델링\n\n**기술 요구사항:**\n- Three.js 최적화\n- 물리 엔진 적용\n- 조명 시스템\n- 재질 시스템',
                  due_on: addDays(now, 45)
                },
                {
                  title: '🎬 애니메이션 시스템',
                  description: '고품질 애니메이션 구현\n\n**애니메이션 목표:**\n- 🔄 테마 전환 애니메이션\n- ✨ 파티클 효과\n- 🌊 유체 애니메이션\n- 🎭 캐릭터 애니메이션\n\n**기술 스택:**\n- Framer Motion\n- GSAP (필요시)\n- CSS 애니메이션\n- WebGL 셰이더',
                  due_on: addDays(now, 60)
                }
              ],
              
              timeBased: [
                {
                  title: `📅 ${new Date().getFullYear()}년 ${String(new Date().getMonth() + 1).padStart(2, '0')}월 목표`,
                  description: '이번 달 개발 목표\n\n**이번 달 우선순위:**\n- 🎯 가장 중요한 기능 완성\n- 🐛 중요 버그 수정\n- 📝 문서화 작업\n- 🧪 테스트 코드 작성\n\n**마감 작업:**\n- 코드 리뷰 완료\n- 테스트 통과\n- 문서 업데이트',
                  due_on: addDays(now, 30 - now.getDate() + 1)
                },
                {
                  title: `📅 Q${Math.ceil((new Date().getMonth() + 1) / 3)} ${new Date().getFullYear()} 분기 목표`,
                  description: '분기별 주요 개발 목표\n\n**분기 목표:**\n- 🚀 주요 기능 릴리스\n- 📊 성능 지표 달성\n- 👥 사용자 피드백 반영\n- 🔧 기술 부채 해결\n\n**성과 지표:**\n- 기능 완성도 90% 이상\n- 버그 발생률 5% 이하\n- 페이지 로딩 속도 3초 이내\n- 모바일 호환성 100%',
                  due_on: addDays(now, 90)
                }
              ],
              
              technical: [
                {
                  title: '🔧 기술 부채 해결',
                  description: '코드 품질 및 구조 개선\n\n**개선 영역:**\n- ♻️ 코드 리팩토링\n- 📚 타입 안정성 향상\n- 🧪 테스트 커버리지 증가\n- 📖 API 문서화\n\n**목표 지표:**\n- 코드 복잡도 감소\n- 테스트 커버리지 80%+\n- ESLint 오류 0개\n- TypeScript 엄격 모드',
                  due_on: addDays(now, 75)
                },
                {
                  title: '📱 모바일 최적화',
                  description: '모바일 환경 완벽 지원\n\n**최적화 목표:**\n- 📐 반응형 디자인 완성\n- 👆 터치 인터페이스 개선\n- ⚡ 모바일 성능 최적화\n- 🔋 배터리 사용량 최소화\n\n**지원 기기:**\n- iOS Safari\n- Android Chrome\n- 태블릿 환경\n- 다양한 화면 크기',
                  due_on: addDays(now, 50)
                }
              ],
              
              monitoring: [
                {
                  title: '📊 성능 모니터링 구축',
                  description: '성능 분석 및 모니터링 시스템\n\n**모니터링 요소:**\n- 🚀 페이지 로딩 속도\n- 🎮 FPS 측정\n- 💾 메모리 사용량\n- 📡 네트워크 사용량\n\n**도구 및 지표:**\n- Google Analytics\n- Web Vitals\n- 사용자 행동 분석\n- 오류 추적 시스템',
                  due_on: addDays(now, 40)
                }
              ]
            };

            // 선택된 마일스톤만 필터링
            let milestones = [];
            if (inputs.versionMilestones) {
              milestones.push(...allMilestones.version);
              console.log('✅ 버전 릴리스 마일스톤 선택됨');
            }
            if (inputs.featureMilestones) {
              milestones.push(...allMilestones.feature);
              console.log('✅ 기능별 마일스톤 선택됨');
            }
            if (inputs.timeBasedMilestones) {
              milestones.push(...allMilestones.timeBased);
              console.log('✅ 시기별 마일스톤 선택됨');
            }
            if (inputs.technicalMilestones) {
              milestones.push(...allMilestones.technical);
              console.log('✅ 기술적 마일스톤 선택됨');
            }
            if (inputs.monitoringMilestones) {
              milestones.push(...allMilestones.monitoring);
              console.log('✅ 모니터링 마일스톤 선택됨');
            }

            if (milestones.length === 0) {
              console.log('❌ 선택된 마일스톤이 없습니다. 적어도 하나는 선택해주세요.');
              core.setFailed('선택된 마일스톤이 없습니다.');
              return;
            }

            console.log(`📊 총 ${milestones.length}개 마일스톤을 처리합니다.`);

            // 기존 마일스톤 가져오기
            let existingMilestones = [];
            try {
              const { data: milestonesList } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              });
              existingMilestones = milestonesList;
            } catch (error) {
              console.log('기존 마일스톤 조회 실패:', error.message);
            }

            const existingTitles = existingMilestones.map(milestone => milestone.title);

            let created = 0;
            let updated = 0;
            let skipped = 0;

            for (const milestone of milestones) {
              try {
                const existingMilestone = existingMilestones.find(m => m.title === milestone.title);
                
                if (existingMilestone) {
                  // 기존 마일스톤이 열려있고 (설명이 다르거나 강제 업데이트)면 업데이트
                  if (existingMilestone.state === 'open' && 
                      (existingMilestone.description !== milestone.description || inputs.forceUpdate)) {
                    await github.rest.issues.updateMilestone({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      milestone_number: existingMilestone.number,
                      title: milestone.title,
                      description: milestone.description,
                      due_on: milestone.due_on
                    });
                    updated++;
                    console.log(`✅ 업데이트: ${milestone.title}`);
                  } else {
                    skipped++;
                    console.log(`⏭️ 건너뜀: ${milestone.title} (이미 존재하거나 완료됨)`);
                  }
                } else {
                  // 새 마일스톤 생성
                  await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: milestone.title,
                    description: milestone.description,
                    due_on: milestone.due_on
                  });
                  created++;
                  console.log(`🆕 생성: ${milestone.title} (마감: ${milestone.due_on})`);
                }
              } catch (error) {
                console.log(`❌ 실패: ${milestone.title} - ${error.message}`);
                skipped++;
              }
            }

            // 결과 요약
            console.log(`
            🎯 마일스톤 설정 완료!
            🆕 생성: ${created}개
            ✅ 업데이트: ${updated}개
            ⏭️ 건너뜀: ${skipped}개
            📊 총 처리: ${milestones.length}개
            `);

            // GitHub Action summary에 결과 출력
            const summary = `## 🎯 마일스톤 설정 결과

            ### 🎯 선택된 카테고리
            ${inputs.versionMilestones ? '✅' : '❌'} 🚀 버전 릴리스 마일스톤
            ${inputs.featureMilestones ? '✅' : '❌'} 🎲 기능별 마일스톤  
            ${inputs.timeBasedMilestones ? '✅' : '❌'} 📅 시기별 마일스톤
            ${inputs.technicalMilestones ? '✅' : '❌'} 🔧 기술적 마일스톤
            ${inputs.monitoringMilestones ? '✅' : '❌'} 📊 모니터링 마일스톤
            ${inputs.forceUpdate ? '🔄 강제 업데이트 활성화' : ''}
            
            | 상태 | 개수 |
            |------|------|
            | 🆕 생성 | ${created} |
            | ✅ 업데이트 | ${updated} |
            | ⏭️ 건너뜀 | ${skipped} |
            | 📊 총 처리 | ${milestones.length} |

            ### 🎯 마일스톤 카테고리별 설명

            ${inputs.versionMilestones ? `
            #### 🚀 버전 릴리스
            - **v1.0.0**: 첫 번째 공식 릴리스 (기본 기능 완성)
            - **v1.1.0**: UI/UX 개선 (사용자 경험 향상)
            - **v1.2.0**: 성능 최적화 (속도 및 안정성)
            ` : ''}

            ${inputs.featureMilestones ? `
            #### 🎲 기능별 마일스톤
            - **3D 기능 완성**: Three.js 핵심 기능 구현
            - **애니메이션 시스템**: 고품질 애니메이션 구현
            ` : ''}

            ${inputs.timeBasedMilestones ? `
            #### 📅 시기별 목표
            - **월별 목표**: 단기 개발 계획
            - **분기별 목표**: 중장기 로드맵
            ` : ''}

            ${inputs.technicalMilestones ? `
            #### 🔧 기술적 개선
            - **기술 부채 해결**: 코드 품질 향상
            - **모바일 최적화**: 모바일 환경 완벽 지원
            ` : ''}

            ${inputs.monitoringMilestones ? `
            #### 📊 분석 및 모니터링
            - **성능 모니터링**: 분석 시스템 구축
            ` : ''}

            ### 📋 마일스톤 활용 방법
            1. **이슈 생성** 시 적절한 마일스톤 선택
            2. **PR 작성** 시 관련 마일스톤 연결
            3. **진행률 확인** - 자동으로 계산됨
            4. **마감일 관리** - 우선순위 설정에 활용

            > 💡 이제 이슈나 PR을 마일스톤에 연결하여 프로젝트 진행 상황을 체계적으로 관리하세요!
            
            ### 🔗 다음 단계
            - Issues → Milestones에서 생성된 마일스톤 확인
            - 새 이슈 생성 시 마일스톤 선택
            - 프로젝트 보드와 연동하여 시각적 관리
            `;
            
            await core.summary.addRaw(summary).write(); 