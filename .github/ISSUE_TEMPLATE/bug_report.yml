name: 🐛 버그 리포트
description: 예상치 못한 동작이나 오류를 보고해주세요
title: "[BUG] "
labels: ["🐛 bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해주셔서 감사합니다! 🙏
        자세한 정보를 제공해주시면 더 빠르게 문제를 해결할 수 있습니다.

  - type: textarea
    id: description
    attributes:
      label: 🔍 버그 설명
      description: 발생한 버그에 대해 명확하고 간결하게 설명해주세요.
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 재현 방법
      description: 버그를 재현하기 위한 단계별 설명
      placeholder: |
        1. '...' 페이지로 이동
        2. '...' 버튼 클릭
        3. '...' 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 예상 동작
      description: 어떤 동작을 기대했나요?
      placeholder: 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ 실제 동작
      description: 실제로 어떤 일이 일어났나요?
      placeholder: 실제로는 어떻게 동작하나요?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 스크린샷 / 스크린 레코딩
      description: 가능하다면 스크린샷이나 영상을 첨부해주세요.
      placeholder: 이미지나 GIF를 드래그 앤 드롭하거나 붙여넣기 하세요.

  - type: dropdown
    id: browser
    attributes:
      label: 🌐 브라우저
      description: 어떤 브라우저에서 발생했나요?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - 기타 (댓글에 명시)
      multiple: true
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: 📱 디바이스
      description: 어떤 디바이스에서 발생했나요?
      options:
        - Desktop
        - Mobile
        - Tablet
      multiple: true
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 🔧 환경 정보
      description: OS, Node.js 버전 등 환경 정보
      placeholder: |
        - OS: [예: macOS Big Sur, Windows 10]
        - Node.js: [예: v18.17.0]
        - npm/yarn: [예: npm 9.8.1]
      render: markdown

  - type: textarea
    id: console-logs
    attributes:
      label: 📋 콘솔 로그
      description: 브라우저 개발자 도구의 콘솔 에러나 경고 메시지
      placeholder: 콘솔에 나타난 에러 메시지를 붙여넣어 주세요.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 💬 추가 정보
      description: 이 버그와 관련된 추가적인 컨텍스트나 정보가 있다면 설명해주세요.
      placeholder: 다른 추가 정보가 있나요?

  - type: checkboxes
    id: terms
    attributes:
      label: ✅ 체크리스트
      description: 버그 리포트 전에 확인해주세요.
      options:
        - label: 기존 이슈를 검색해보았고, 중복된 이슈가 없음을 확인했습니다.
          required: true
        - label: 이 버그가 최신 버전에서도 발생함을 확인했습니다.
          required: true
        - label: 가능한 한 명확하고 상세한 정보를 제공했습니다.
          required: true 