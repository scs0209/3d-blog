openapi: 3.0.3
info:
  title: 블로그 어드민 대시보드 API
  description: 관리자 대시보드를 위한 API 엔드포인트
  version: 1.0.0
  contact:
    name: 3D 블로그 프로젝트
servers:
  - url: /api/admin
    description: 관리자 API 서버

security:
  - NextAuth: []

paths:
  /dashboard:
    get:
      summary: 대시보드 통계 조회
      description: 관리자 대시보드의 통계 데이터를 조회합니다
      security:
        - NextAuth: []
      parameters:
        - name: period
          in: query
          description: 통계 기간 (7d, 30d, 90d, 1y)
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts:
    get:
      summary: 포스트 목록 조회
      description: 관리자용 포스트 목록을 조회합니다
      security:
        - NextAuth: []
      parameters:
        - name: page
          in: query
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 페이지당 항목 수
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: 게시 상태 필터
          schema:
            type: string
            enum: [all, published, draft]
            default: all
        - name: category
          in: query
          description: 카테고리 필터
          schema:
            type: string
        - name: search
          in: query
          description: 검색어
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostManagementView'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    patch:
      summary: 포스트 상태 변경
      description: 포스트의 게시 상태를 변경합니다
      security:
        - NextAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 포스트 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                published:
                  type: boolean
              required:
                - published
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostManagementView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /comments:
    get:
      summary: 댓글 목록 조회
      description: 관리자용 댓글 목록을 조회합니다
      security:
        - NextAuth: []
      parameters:
        - name: page
          in: query
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 페이지당 항목 수
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: 승인 상태 필터
          schema:
            type: string
            enum: [all, approved, pending, rejected]
            default: all
        - name: postId
          in: query
          description: 포스트 ID 필터
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommentManagementView'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /comments/{id}:
    patch:
      summary: 댓글 상태 변경
      description: 댓글의 승인 상태를 변경합니다
      security:
        - NextAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 댓글 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved:
                  type: boolean
              required:
                - approved
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentManagementView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    get:
      summary: 사용자 목록 조회
      description: 관리자용 사용자 목록을 조회합니다
      security:
        - NextAuth: []
      parameters:
        - name: page
          in: query
          description: 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 페이지당 항목 수
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          description: 역할 필터
          schema:
            type: string
            enum: [all, admin, user]
            default: all
        - name: search
          in: query
          description: 검색어 (이름, 이메일)
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserManagementView'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    patch:
      summary: 사용자 권한 변경
      description: 사용자의 관리자 권한을 변경합니다
      security:
        - NextAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 사용자 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAdmin:
                  type: boolean
              required:
                - isAdmin
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagementView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    NextAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardStats:
      type: object
      properties:
        totalPosts:
          type: integer
          description: 전체 포스트 수
        totalComments:
          type: integer
          description: 전체 댓글 수
        totalUsers:
          type: integer
          description: 전체 사용자 수
        totalViews:
          type: integer
          description: 전체 조회수
        recentPosts:
          type: array
          items:
            $ref: '#/components/schemas/PostManagementView'
        recentComments:
          type: array
          items:
            $ref: '#/components/schemas/CommentManagementView'
        recentUsers:
          type: array
          items:
            $ref: '#/components/schemas/UserManagementView'
        chartData:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'

    ChartDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        posts:
          type: integer
        comments:
          type: integer
        users:
          type: integer
        views:
          type: integer

    PostManagementView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        published:
          type: boolean
        commentCount:
          type: integer
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommentManagementView:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        post:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserManagementView:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        postCount:
          type: integer
        commentCount:
          type: integer
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 인증되지 않은 사용자
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: 권한이 없는 사용자
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
